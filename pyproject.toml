[project]
name = "youtube-transcript-fallback"
version = "0.1.0"
description = "Fetch YouTube captions into markdown files, with Supadata as the fallback when YouTube blocks the IP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.8",
    "youtube-transcript-api>=1.2",
    "supadata==1.6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
